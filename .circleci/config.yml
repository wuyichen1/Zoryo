# .circleci/config.yml
version: 2.1

jobs:
  build-and-upload:
    macos:
      xcode: "26.2" #自己当前Xcode版本

    environment:
      BUNDLE_PATH: vendor/bundle # Bundler 安装路径，方便缓存
      FL_OUTPUT_DIR: build
      FLUTTER_VERSION: "3.32.6"

      LC_ALL: en_US.UTF-8
      LANG: en_US.UTF-8
    #      FASTLANE_USER: "${FASTLANE_USER}"
    #      ASC_KEY_ID: "${ASC_KEY_ID}"
    #      ASC_ISSUER_ID: "${ASC_ISSUER_ID}"
    #      ASC_KEY_CONTENT: "${ASC_KEY_CONTENT}"
    #      MATCH_PASSWORD: "${MATCH_PASSWORD}"

    steps:
      - checkout

      - run:
          name: Setup environment
          command: |
            mkdir -p "$FL_OUTPUT_DIR"
            xcodebuild -version
            git config --global user.email "ci@example.com"
            git config --global user.name "CI Bot"
            git config --list | grep user.

      - restore_cache:
          keys:
            - v1-bundle-{{ checksum "Gemfile.lock" }}
            - v1-bundle-

      - run:
          name: Setup Ruby
          command: |
            eval "$(rbenv init -)"

            rbenv install 3.3.6 --skip-existing
            rbenv global 3.3.6

            ruby -v
            gem -v

      - run:
          name: Install Bundler & Gems
          command: |
            gem install bundler
            bundle config set path 'vendor/bundle'
            bundle install

      - save_cache:
          paths:
            - vendor/bundle
          key: v1-bundle-{{ checksum "Gemfile.lock" }}

      - restore_cache:
          keys:
            - v1-flutter-sdk-{{ .Environment.FLUTTER_VERSION }}

      - run:
          name: Install Flutter
          command: |
            if [ ! -d "$HOME/flutter/bin" ]; then
              git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$HOME/flutter"
            fi

            echo 'export PATH="$HOME/flutter/bin:$HOME/flutter/bin/cache/dart-sdk/bin:$PATH"' >> "$BASH_ENV"
            source "$BASH_ENV"

            flutter --version
            flutter config --no-analytics
            flutter precache --ios

      - save_cache:
          paths:
            - ~/flutter
          key: v1-flutter-sdk-{{ .Environment.FLUTTER_VERSION }}

      - restore_cache:
          keys:
            - v1-pub-cache-{{ checksum "pubspec.lock" }}
            - v1-pub-cache-

      - run:
          name: Install Flutter dependencies
          command: |
            source "$BASH_ENV"
            flutter pub get

      - save_cache:
          paths:
            - ~/.pub-cache
          key: v1-pub-cache-{{ checksum "pubspec.lock" }}

      - run:
          name: Install CocoaPods
          command: |
            source "$BASH_ENV"
            bundle exec pod install --project-directory=ios
            test -f "ios/Pods/Target Support Files/Pods-Runner/Pods-Runner-resources-Release-input-files.xcfilelist"
            test -f "ios/Pods/Target Support Files/Pods-Runner/Pods-Runner-resources-Release-output-files.xcfilelist"
            test -f "ios/Pods/Target Support Files/Pods-Runner/Pods-Runner-frameworks-Release-input-files.xcfilelist"
            test -f "ios/Pods/Target Support Files/Pods-Runner/Pods-Runner-frameworks-Release-output-files.xcfilelist"

      - run:
          name: Run Fastlane
          command: |
            source "$BASH_ENV"
            bundle exec fastlane release

      - run:
          name: Zip ipa
          command: |
            cd build
            zip ipa.zip *.ipa

      - store_artifacts:
          path: build

workflows:
  version: 2
  build-and-upload:
    jobs:
      - build-and-upload:
          filters:
            branches:
              only:
                - release # 当前打包分支---github对应的分支
